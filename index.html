<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baga Burger Branch Map</title>

    <!-- =====================================================
         LEAFLET MAP
    ====================================================== -->

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- =====================================================
         LEAFLET DRAW
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* =====================================================
           HEADER
        ====================================================== */

        .header {
            background: #ffffff;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-height: 62px;
            position: relative;
            z-index: 3000;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            margin-right: 15px;
        }

        /* =====================================================
           SEARCH BOX
        ====================================================== */

        #searchBox {
            padding: 8px;
            width: 230px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        #searchButton,
        #commentButton,
        #addBranchButton {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #f2f2f2;
        }

        #searchButton:hover,
        #commentButton:hover,
        #addBranchButton:hover {
            background: #e5e5e5;
        }

        #commentButton.active {
            font-weight: bold;
            background: #ffe600;
        }

        /* =====================================================
           MAP
        ====================================================== */

        #map {
            height: calc(100vh - 62px);
            width: 100%;
            position: relative;
        }

        /* =====================================================
           MAP COMMENT
        ====================================================== */

        .map-comment {
            background: yellow;
            border: 2px solid #333;
            border-radius: 7px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #ff0000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.30);
            white-space: nowrap;
        }

        /* =====================================================
           COMMENT FORM
        ====================================================== */

        .comment-input {
            width: 230px;
            padding: 7px;
            margin-top: 4px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .comment-button {
            margin-top: 7px;
            padding: 6px 10px;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 4px;
            background: #f5f5f5;
        }

        .comment-button:hover {
            background: #e5e5e5;
        }

        /* =====================================================
           CREATOR NOTES PANEL
        ====================================================== */

        #creatorNotesPanel {
            position: fixed;
            left: 0;
            top: 62px;
            bottom: 0;
            width: 360px;
            background: #fcfbb5;
            z-index: 1800;
            box-shadow: 3px 0 14px rgba(0,0,0,0.18);
            transform: translateX(0);
            transition: transform 0.25s ease;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
        }

        #creatorNotesPanel.collapsed {
            transform: translateX(calc(-100% + 44px));
        }

        #creatorNotesTab {
            position: absolute;
            right: -44px;
            top: 18px;
            width: 44px;
            height: 118px;
            border: 1px solid #d5c8b4;
            border-left: none;
            border-radius: 0 9px 9px 0;
            background: #fcfbb5;
            color: #4a4034;
            cursor: pointer;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 3px 2px 8px rgba(0,0,0,0.12);
        }

        #creatorNotesHeader {
            padding: 14px 16px 10px;
            border-bottom: 1px solid #d5c8b4;
            flex-shrink: 0;
        }

        #creatorNotesHeader h3 {
            margin: 0 0 4px;
            font-size: 17px;
        }

        #creatorNotesHeader p {
            margin: 0;
            font-size: 12px;
            color: #756b5f;
        }

        #creatorAreaSections {
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .creator-area-section {
            background: #fffdf8;
            border: 1px solid #d5c8b4;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
        }

        .creator-area-header {
            width: 100%;
            border: none;
            background: #eee6d8;
            color: #3f372d;
            padding: 11px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            text-align: left;
        }

        .creator-area-header:hover {
            background: #e7ddcc;
        }

        .creator-area-arrow {
            font-size: 13px;
            transition: transform 0.2s ease;
        }

        .creator-area-section.collapsed .creator-area-arrow {
            transform: rotate(-90deg);
        }

        .creator-area-content {
            padding: 10px;
        }

        .creator-area-section.collapsed .creator-area-content {
            display: none;
        }

        .creator-name-input,
        .creator-note-input {
            width: 100%;
            border: 1px solid #c7baa7;
            border-radius: 6px;
            background: #fff;
            padding: 8px 9px;
            font-family: inherit;
            font-size: 12px;
            margin-bottom: 7px;
            outline: none;
        }

        .creator-name-input:focus,
        .creator-note-input:focus {
            border-color: #8d7b63;
        }

        .creator-note-input {
            min-height: 58px;
            resize: vertical;
        }

        .add-area-note-button {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid #8d7b63;
            border-radius: 6px;
            background: #4a4034;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .add-area-note-button:hover {
            opacity: 0.9;
        }

        .creator-area-list {
            margin-top: 9px;
        }

        .creator-note-card {
            position: relative;
            background: #fff8b8;
            border: 1px solid #ded28a;
            border-radius: 5px;
            padding: 10px 30px 9px 11px;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        .creator-note-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #c8ad45;
        }

        .creator-note-name {
            font-size: 13px;
            font-weight: bold;
            color: #40382d;
            margin-bottom: 4px;
        }

        .creator-note-text {
            font-size: 12px;
            line-height: 1.4;
            color: #5f5548;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .delete-creator-note {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #8a7762;
            cursor: pointer;
            font-size: 17px;
            line-height: 20px;
        }

        .delete-creator-note:hover {
            background: #eadb9a;
            color: #333;
        }

        .edit-creator-note {
            position: absolute;
            right: 34px;
            top: 7px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
        }

        .creator-notes-empty {
            padding: 8px 3px 2px;
            color: #8a7f70;
            font-size: 11px;
            text-align: center;
            line-height: 1.4;
        }

        /* =====================================================
           SEARCH RESULTS
        ====================================================== */

        #searchResults {
            position: fixed;
            top: 55px;
            left: 250px;
            background: white;
            z-index: 5000;
            max-height: 300px;
            overflow-y: auto;
            width: 300px;
            border: 1px solid #ccc;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .search-result {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .search-result:hover {
            background: #f0f0f0;
        }

        /* =====================================================
           BRANCH INFORMATION PANEL
        ====================================================== */

        .branch-info-panel {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 360px;
            max-width: calc(100% - 40px);
            max-height: calc(100% - 40px);
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.20);
            z-index: 1000;
            display: none;
            font-family: Arial, sans-serif;
        }

        .branch-info-panel.active {
            display: block;
        }

        .branch-info-close {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            font-size: 20px;
            cursor: pointer;
        }

        .branch-info-title {
            font-size: 21px;
            font-weight: bold;
            padding-right: 30px;
            margin-bottom: 8px;
        }

        .branch-info-quote {
            font-size: 14px;
            font-style: italic;
            opacity: 0.75;
            margin-bottom: 18px;
        }

        .branch-info-item {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .branch-info-label {
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .branch-info-link {
            color: #1264a3;
            text-decoration: none;
            word-break: break-all;
        }

        .branch-info-link:hover {
            text-decoration: underline;
        }

        .branch-info-notes {
            width: 100%;
            min-height: 80px;
            resize: vertical;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.55);
            font-family: inherit;
            outline: none;
        }

        .branch-info-input {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid #bbb;
            margin-bottom: 7px;
            font-family: inherit;
        }

        .branch-info-save {
            margin-top: 8px;
            padding: 8px 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #222;
            color: #fff;
        }

        .branch-info-edit {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #f1f1f1;
            margin-right: 5px;
        }

        .branch-info-edit:hover {
            background: #ddd;
        }

        @media (max-width: 700px) {

            .header-title {
                width: 100%;
            }

            #searchBox {
                width: 180px;
            }

            #creatorNotesPanel {
                width: 300px;
            }

            .branch-info-panel {
                width: 300px;
                right: 10px;
                bottom: 10px;
            }

            #searchResults {
                left: 10px;
                top: 105px;
                width: calc(100% - 20px);
            }

        }


        #authArea {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        #authStatus {
            font-size: 12px;
            color: #555;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .auth-button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #f2f2f2;
        }

        .auth-button:hover {
            background: #e5e5e5;
        }

        #loginModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        #loginModal.active { display: flex; }

        .login-card {
            width: min(360px, calc(100vw - 30px));
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.25);
        }

        .login-card h3 { margin-top: 0; }

        .login-card input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .login-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER

<div class="header">

</div>


<div id="searchResults"></div>

</div>




<!-- =========================================================

<div id="creatorNotesPanel">

                <textarea
                    class="creator-note-input"

                >

                <textarea
                    class="creator-note-input"
                    id="creatorNoteSouth"

                <button
                    class="add-area-note-button"

<!-- =========================================================

<div id="map">

    <!-- =====================================================

<script>
    const { createClient } = supabase;

const db = createClient(
    "https://bajteupkizbjrtktyftj.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhanRldXBraXpianJ0a3R5ZnRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzkxOTMsImV4cCI6MjEwMjMxNTE5M30.E1bu5BQlmNCZXYSkDG1U6jGytGwW48SNAYJH_75R9Z4"
    
/* ============================================================
   1. INITIAL MAP
============================================================ */

var map = L.map('map').setView(
    [14.85, 120.90],
    10
);


/* ============================================================
   2. MAP BACKGROUND
============================================================ */

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* ============================================================
   3. BRANCH DATA
============================================================ */

var branches = [];


/* ============================================================
   4. STORAGE
============================================================ */

var branchEditsStorageKey = 'bagaBurgerBranchEdits';
var branchEdits = {};

/* ============================================================
   SUPABASE CONFIGURATION
============================================================ */

var SUPABASE_URL = 'https://bajteupkizbjrtktyftj.supabase.co';
var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rCDJuXABi7J5APDiatGwPw_2zzG3U_g';
var supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

var currentUser = null;

function isEditor() {
    return !!currentUser;
}

function requireEditor() {
    if (!isEditor()) {
        alert('View only. Please login with an authorized Supabase account to edit.');
        openLogin();
        return false;
    }
    return true;
}

function updateAuthUI() {
    var status = document.getElementById('authStatus');
    var loginButton = document.getElementById('loginButton');
    var logoutButton = document.getElementById('logoutButton');
    var editButtons = [
        document.getElementById('addBranchButton'),
        document.getElementById('commentButton')
    ];

    if (currentUser) {
        status.textContent = 'Editor: ' + (currentUser.email || 'Authorized user');
        loginButton.style.display = 'none';
        logoutButton.style.display = 'inline-block';
        editButtons.forEach(function(btn) { if (btn) btn.style.display = 'inline-block'; });
    } else {
        status.textContent = 'Public view';
        loginButton.style.display = 'inline-block';
        logoutButton.style.display = 'none';
        editButtons.forEach(function(btn) { if (btn) btn.style.display = 'inline-block'; });
    }
}

function openLogin() {
    document.getElementById('loginMessage').textContent = '';
    document.getElementById('loginModal').classList.add('active');
    setTimeout(function(){ document.getElementById('loginEmail').focus(); }, 50);
}

function closeLogin() {
    document.getElementById('loginModal').classList.remove('active');
}

async function loginUser() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var msg = document.getElementById('loginMessage');

    if (!email || !password) {
        msg.textContent = 'Enter your email and password.';
        return;
    }

    msg.textContent = 'Logging in...';

    var result = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (result.error) {
        msg.textContent = result.error.message;
        return;
    }

    currentUser = result.data.user;
    updateAuthUI();
    closeLogin();
    alert('Login successful. You can now edit the map.');
}

async function logoutUser() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    updateAuthUI();
    alert('Logged out. The map is now view-only.');
}

async function initAuth() {
    var sessionResult = await supabaseClient.auth.getSession();
    currentUser = sessionResult.data.session ? sessionResult.data.session.user : null;
    updateAuthUI();

    supabaseClient.auth.onAuthStateChange(function(event, session) {
        currentUser = session ? session.user : null;
        updateAuthUI();
    });
}

async function loadBranchEdits() {

    try {

        const { data, error } = await supabase
            .from("branch_edits")
            .select("*");

        if (error) {
            console.error("Load branch edits error:", error);
            branchEdits = {};
            return;
        }

        branchEdits = {};

        data.forEach(item => {
            branchEdits[item.branch_id] = item.edits;
        });

    } catch (error) {

        console.error(error);
        branchEdits = {};

    }

}


async function saveBranchEdits(branchId, edits) {

    try {

        const { error } = await supabase
            .from("branch_edits")
            .upsert({
                branch_id: branchId,
                edits: edits
            });

        if (error) {
            console.error("Save branch edits error:", error);
        }

    } catch(error) {

        console.error(error);

    }

}
async function saveBranchToSupabase(branch) {
    if (!requireEditor()) return false;

    var payload = {
        original_name: branch.originalName,
        name: branch.name,
        area: branch.area || '',
        address: branch.address || '',
        facebook: branch.facebook || '',
        website: branch.website || '',
        quote: branch.quote || '',
        notes: branch.notes || '',
        lat: Number(branch.lat),
        lng: Number(branch.lng)
    };

    var existing = await supabaseClient
        .from('branches')
        .select('id')
        .eq('original_name', branch.originalName)
        .maybeSingle();

    if (existing.error && existing.error.code !== 'PGRST116') {
        console.error(existing.error);
        alert('Supabase lookup failed: ' + existing.error.message);
        return false;
    }

    var result;

    if (existing.data && existing.data.id != null) {
        result = await supabaseClient
            .from('branches')
            .update(payload)
            .eq('id', existing.data.id);
    } else {
        result = await supabaseClient
            .from('branches')
            .insert(payload);
    }

    if (result.error) {
        console.error(result.error);
        alert('Could not save to Supabase: ' + result.error.message);
        return false;
    }

    branchEdits[branch.originalName] = payload;
    saveBranchEdits(currentBranchId, branchEdits[currentBranchId]);
    return true;
}

async function loadBranchesFromSupabase() {
    var result = await supabaseClient
        .from('branches')
        .select('*')
        .order('id', { ascending: true });

    if (result.error) {
        console.error('Could not load Supabase branches:', result.error);
        return;
    }

    (result.data || []).forEach(function(row) {
        var branch = branches.find(function(b) {
            return b.originalName === row.original_name;
        });

        if (branch) {
            branch.name = row.name || branch.name;
            branch.area = row.area || branch.area;
            branch.address = row.address || '';
            branch.facebook = row.facebook || '';
            branch.website = row.website || '';
            branch.quote = row.quote || '';
            branch.notes = row.notes || '';
            if (row.lat != null) branch.lat = Number(row.lat);
            if (row.lng != null) branch.lng = Number(row.lng);
            refreshBranchPopup(branch);
            if (branch.marker) branch.marker.setLatLng([branch.lat, branch.lng]);
        } else if (row.lat != null && row.lng != null) {
            var newBranch = addBranch(
                row.name || row.original_name,
                Number(row.lat),
                Number(row.lng),
                row.area || '',
                row.address || '',
                row.facebook || '',
                row.website || '',
                row.quote || '',
                row.notes || ''
            );
            if (newBranch) newBranch.originalName = row.original_name || newBranch.name;
        }
    });

    if (typeof searchBranch === 'function') searchBranch();
}

/* ============================================================
   5. SECURITY / HTML ESCAPE
============================================================ */

function escapePopupText(text) {

    return String(
        text == null ? '' : text
    )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* ============================================================
   URL VALIDATION
============================================================ */

function safeUrl(url) {

    if (!url) {
        return '';
    }

    url = String(url).trim();

    if (
        url.startsWith('https://') ||
        url.startsWith('http://')
    ) {

        return url;

    }

    return '';

}

/* ============================================================
   8. ADD BRANCH
============================================================ */

function addBranch(
    name,
    lat,
    lng,
    area,
    address,
    facebook,
    website,
    quote,
    notes
) {

    var branch = {

        id: branches.length,

        originalName: name,

        name: name,

        lat: Number(lat),

        lng: Number(lng),

        area: area || '',

        address: address || '',

        facebook: facebook || '',

        website: website || '',

        quote: quote || '',

        notes: notes || '',

        marker: null

    };


    var saved =
        branchEdits[
            branch.originalName
        ];


    if (saved) {

        if (saved.name) {
            branch.name = saved.name;
        }

        if (saved.area) {
            branch.area = saved.area;
        }

        if (
            saved.lat !== undefined &&
            Number.isFinite(
                Number(saved.lat)
            )
        ) {

            branch.lat =
                Number(saved.lat);

        }

        if (
            saved.lng !== undefined &&
            Number.isFinite(
                Number(saved.lng)
            )
        ) {

            branch.lng =
                Number(saved.lng);

        }

        if (
            saved.address !== undefined
        ) {

            branch.address =
                saved.address;

        }

        if (
            saved.facebook !== undefined
        ) {

            branch.facebook =
                saved.facebook;

        }

        if (
            saved.website !== undefined
        ) {

            branch.website =
                saved.website;

        }

        if (
            saved.quote !== undefined
        ) {

            branch.quote =
                saved.quote;

        }

        if (
            saved.notes !== undefined
        ) {

            branch.notes =
                saved.notes;

        }

    }


    if (
        !Number.isFinite(branch.lat) ||
        !Number.isFinite(branch.lng)
    ) {

        console.warn(
            'Invalid coordinates for:',
            branch.name
        );

        return null;

    }


    branch.marker =
        L.marker([
            branch.lat,
            branch.lng
        ]).addTo(map);


    branch.marker.bindPopup(
        buildBranchPopup(branch)
    );


    branch.marker.on(
        'click',
        function() {

            openBranchInfo(branch);

        }
    );


    branches.push(branch);


    return branch;

}

async function editBranch(id) {

    var branch =

    if (name === null) {
        return;

    var area =
        prompt(
            'Area:',

        );


    if (area === null) {
        return;
    }


    var address =
        prompt(
            'Complete Address:',
            branch.address || ''
        );


    if (address === null) {
        return;
    }


    var facebook =
        prompt(
            'Facebook Page URL:',
            branch.facebook || ''
        );


    if (facebook === null) {
        return;
    }


    var website =
        prompt(
            'Website URL:',
            branch.website || ''
        );


    if (website === null) {
        return;
    }


    var lat =
        prompt(
            'Latitude:',
            branch.lat
        );


    if (lat === null) {
        return;
    }


    var lng =
        prompt(
            'Longitude:',
            branch.lng
        );


    if (lng === null) {
        return;
    }


    lat = Number(lat);
    lng = Number(lng);


    if (
        !name.trim() ||
        !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ) {

        alert(
            'Please enter a valid branch name and coordinates.'
        );

        return;

    }


    if (
        facebook.trim() &&
        !safeUrl(facebook)
    ) {

        alert(
            'Facebook URL must start with http:// or https://'
        );

        return;

    }


    if (
        website.trim() &&
        !safeUrl(website)
    ) {

        alert(
            'Website URL must start with http:// or https://'
        );

        return;

    }


    branch.name =
        name.trim();


    branch.area =
        area.trim() ||
        branch.area;


    branch.address =
        address.trim();


    branch.facebook =
        facebook.trim();


    branch.website =
        website.trim();


    branch.lat =
        lat;


    branch.lng =
        lng;


    if (!branchEdits[branch.originalName]) {

        branchEdits[
            branch.originalName
        ] = {};

    }


    branchEdits[
        branch.originalName
    ] = {

        name: branch.name,

        area: branch.area,

        address: branch.address,

        facebook: branch.facebook,

        website: branch.website,

        quote: branch.quote,

        notes: branch.notes,

        lat: branch.lat,

        lng: branch.lng

    };


    saveBranchEdits(currentBranchId, branchEdits[currentBranchId]);

    var saved = await saveBranchToSupabase(branch);
    if (!saved) return;

    refreshBranchPopup(branch);


    openBranchInfo(branch);

}

/* ============================================================
   13. DRAWING TOOL
============================================================ */

var drawControl =
    new L.Control.Draw({

        position: 'topright',

        draw: {

            polyline: {

                shapeOptions: {
                    weight: 4
                }

            },

            polygon: false,

            circle: {

                shapeOptions: {
                    fillOpacity: 0.15
                }

            },

            rectangle: {

                shapeOptions: {
                    fillOpacity: 0.15
                }

            },

            marker: false,

            circlemarker: false

        },

        edit: {

            featureGroup: drawnItems,

            remove: true

        }

    });


map.addControl(
    drawControl
);


/* ============================================================
   14. DRAW CREATED
============================================================ */

map.on(
    L.Draw.Event.CREATED,
    function(event) {

        var layer =
            event.layer;


        drawnItems.addLayer(
            layer
        );


        if (
            layer instanceof L.Polyline &&
            !(layer instanceof L.Polygon)
        ) {

            var latlngs =
                layer.getLatLngs();


            var totalDistance =
                0;


            for (
                var i = 1;
                i < latlngs.length;
                i++
            ) {

                totalDistance +=
                    latlngs[i - 1]
                    .distanceTo(
                        latlngs[i]
                    );

            }


            var km =
                (
                    totalDistance / 1000
                ).toFixed(2);


            layer.bindPopup(
                '<b>Route / Distance</b><br>' +
                'Distance: ' +
                km +
                ' km'
            );

        }


        else if (
            layer instanceof L.Circle
        ) {

            var radius =
                layer.getRadius();


            var radiusKm =
                (
                    radius / 1000
                ).toFixed(2);


            layer.bindPopup(
                '<b>Coverage Circle</b><br>' +
                'Radius: ' +
                radiusKm +
                ' km'
            );

        }


        else if (
            layer instanceof L.Rectangle
        ) {

            layer.bindPopup(
                '<b>Vlogger Territory</b><br>' +
                'You can edit or resize this area.'
            );

        }

    }
);

function createCommentIcon(text) {

    return L.divIcon({

        className: '',

        html:
            '<div class="map-comment">' +

            escapePopupText(text)
                .replace(/\n/g, '<br>') +

            '</div>',

        iconSize: null,

        iconAnchor: [0, 0]

    });

}


/* ============================================================

============================================================ */

function activateCommentMode() {

    commentMode = true;


    var button =
        document.getElementById(
            'commentButton'
        );


    button.classList.add(
        'active'
    );


    button.innerHTML =
        '📝 Click Map to Add Comment';

}

map.on(
    'click',
    function(e) {

        if (!commentMode) {
            return;
        }


        commentMode = false;


        var button =
            document.getElementById(
                'commentButton'
            );


        button.classList.remove(
            'active'
        );


        button.innerHTML =
            '📝 Add Comment';


        commentLat =
            e.latlng.lat;


        commentLng =
            e.latlng.lng;


        var popupContent =

            '<b>Add Map Comment</b>' +

            '<br><br>' +

            '<textarea ' +
                'id="mapCommentText" ' +
                'class="comment-input" ' +
                'rows="4" ' +
                'placeholder="Example: Vlogger 1 Territory">' +
            '</textarea>' +

            '<br>' +

            '<button ' +
                'class="comment-button" ' +
                'onclick="saveMapComment()">' +

                'Add Comment' +

            '</button>';


        L.popup()

            .setLatLng(
                e.latlng
            )

            .setContent(
                popupContent
            )

            .openOn(map);

    }
);


/* ============================================================
   19. SAVE COMMENT
============================================================ */

function saveMapComment() {

    var input =
        document.getElementById(
            'mapCommentText'
        );


    if (!input) {
        return;
    }


    var text =
        input.value.trim();


    if (text === '') {

        alert(
            'Please enter a comment.'
        );

        return;

    }


    var marker =
        L.marker(

            [
                commentLat,
                commentLng
            ],

            {
                icon:
                    createCommentIcon(
                        text
                    ),

                draggable: true
            }

        );


    commentItems.addLayer(
        marker
    );


    marker._commentText =
        text;


    marker.bindPopup(

        '<b>Edit Comment</b>' +

        '<br><br>' +

        '<textarea ' +
            'id="editCommentText" ' +
            'class="comment-input" ' +
            'rows="4">' +

            escapePopupText(text) +

        '</textarea>' +

        '<br>' +

        '<button ' +
            'class="comment-button" ' +
            'onclick="editMapComment()">' +

            'Save Changes' +

        '</button>' +

        '<br><br>' +

        '<button ' +
            'class="comment-button" ' +
            'onclick="deleteMapComment()">' +

            '🗑️ Delete Comment' +

        '</button>'

    );


    marker.on(
        'click',
        function() {

            currentCommentMarker =
                marker;

        }
    );


    currentCommentMarker =
        marker;


    map.closePopup();

}


/* ============================================================
   20. EDIT COMMENT
============================================================ */

function editMapComment() {

    if (!requireEditor()) return;

    var marker =
        currentCommentMarker;


    if (!marker) {
        return;
    }


    var input =
        document.getElementById(
            'editCommentText'
        );


    if (!input) {
        return;
    }


    var newText =
        input.value.trim();


    if (newText === '') {

        alert(
            'Comment cannot be empty.'
        );

        return;

    }


    marker._commentText =
        newText;


    marker.setIcon(
        createCommentIcon(
            newText
        )
    );


    marker.closePopup();

}


/* ============================================================
   21. DELETE COMMENT
============================================================ */

function deleteMapComment() {

    if (!requireEditor()) return;

    var marker =
        currentCommentMarker;


    if (!marker) {
        return;
    }


    commentItems.removeLayer(
        marker
    );


    currentCommentMarker =
        null;

}


/* ============================================================
   22. SEARCH BRANCH
============================================================ */

function searchBranch() {

    var query =
        document
            .getElementById(
                'searchBox'
            )
            .value
            .toLowerCase()
            .trim();


    var resultsBox =
        document.getElementById(
            'searchResults'
        );


    resultsBox.innerHTML =
        '';


    if (query === '') {

        resultsBox.style.display =
            'none';

        return;

    }


    var results =
        branches.filter(
            function(branch) {

                return (

                    branch.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    String(
                        branch.area || ''
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        branch.address || ''
                    )
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    if (results.length === 0) {

        resultsBox.innerHTML =
            '<div class="search-result">' +
                'No branch found.' +
            '</div>';

        resultsBox.style.display =
            'block';

        return;

    }


    results.forEach(
        function(branch) {

            var div =
                document.createElement(
                    'div'
                );


            div.className =
                'search-result';


            div.innerHTML =

                '<b>' +
                    escapePopupText(
                        branch.name
                    ) +
                '</b>' +

                '<br>' +

                escapePopupText(
                    branch.area
                );


            div.onclick =
                function() {

                    map.setView(

                        [
                            branch.lat,
                            branch.lng
                        ],

                        16

                    );


                    branch.marker.openPopup();


                    openBranchInfo(
                        branch
                    );


                    resultsBox.style.display =
                        'none';

                };


            resultsBox.appendChild(
                div
            );

        }
    );


    resultsBox.style.display =
        'block';

}


/* ============================================================
   23. SEARCH WHILE TYPING
============================================================ */

document
    .getElementById(
        'searchBox'
    )
    .addEventListener(
        'input',
        function() {

            searchBranch();

        }
    );


/* ============================================================
   ENTER TO SEARCH
============================================================ */

document
    .getElementById(
        'searchBox'
    )
    .addEventListener(
        'keydown',
        function(event) {

            if (
                event.key === 'Enter'
            ) {

                searchBranch();

            }

        }
    );


/* ============================================================
   CLICK OUTSIDE SEARCH RESULTS
============================================================ */

document.addEventListener(
    'click',
    function(event) {

        var resultsBox =
            document.getElementById(
                'searchResults'
            );

        var searchBox =
            document.getElementById(
                'searchBox'
            );

        if (
            event.target !== searchBox &&
            !resultsBox.contains(
                event.target
            )
        ) {

            resultsBox.style.display =
                'none';

        }

    }
);


/* ============================================================
   24. FIT MAP TO ALL BRANCHES
============================================================ */

if (branches.length > 0) {

    var branchMarkers = [];


    branches.forEach(
        function(branch) {

            if (branch.marker) {

                branchMarkers.push(
                    branch.marker
                );

            }

        }
    );


    if (branchMarkers.length > 0) {

        var group =
            L.featureGroup(
                branchMarkers
            );


        map.fitBounds(
            group
                .getBounds()
                .pad(0.10)
        );

    }

}


/* ============================================================
   25. CREATOR NOTES
============================================================ */

    NCR: [],

var creatorNotesStorageKey =
    'bagaBurgerCreatorNotesByArea';

}

/* ============================================================
   SAVE CREATOR NOTES
============================================================ */

async function saveCreatorNotes(area, creatorData) {

        .from("creator_notes")
        .insert({
            area: area,
            creator_name: creatorData.name,
            note: creatorData.note
        });

            "Supabase save error:",
            error
        );
    }

        );

/* ============================================================
   ESCAPE CREATOR TEXT
============================================================ */

function escapeCreatorNoteText(text) {

    return String(
        text || ''
    )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* ============================================================
   ADD CREATOR NOTE
============================================================ */

function addCreatorNote(area) {

    if (!requireEditor()) return;

    var nameInput =
        document.getElementById(
            'creatorName' + area
        );


    var noteInput =
        document.getElementById(
            'creatorNote' + area
        );


    if (
        !nameInput ||
        !noteInput
    ) {

        return;

    }


    var name =
        nameInput.value.trim();


    var note =
        noteInput.value.trim();


    if (!name) {

        nameInput.focus();


        alert(
            'Please enter the vlogger / content creator name.'
        );


        return;

    }


    var newCreatorNote = {

    id: Date.now() + Math.random(),

    name:name,

    note:note

};


creatorNotes[area].unshift(
    newCreatorNote
);


saveCreatorNotes(
    area,
    newCreatorNote
);


    renderCreatorNotes();


    nameInput.value =
        '';

    noteInput.value =
        '';

    nameInput.focus();

}


/* ============================================================
   EDIT CREATOR NOTE
============================================================ */

function editCreatorNote(
    area,
    id
) {

    var item =
        creatorNotes[area].find(
            function(note) {

                return note.id === id;

            }
        );


    if (!item) {
        return;
    }


    var name =
        prompt(
            'Creator / Vlogger name:',
            item.name
        );


    if (name === null) {
        return;
    }


    var note =
        prompt(
            'Note:',
            item.note || ''
        );


    if (note === null) {
        return;
    }


    if (!name.trim()) {

        alert(
            'Creator name cannot be empty.'
        );

        return;

    }


    item.name =
        name.trim();


    item.note =
        note.trim();


    saveCreatorNotes();


    renderCreatorNotes();

}


/* ============================================================
   DELETE CREATOR NOTE
============================================================ */

function deleteCreatorNote(
    area,
    id
) {

    creatorNotes[area] =
        creatorNotes[area].filter(
            function(item) {

                return item.id !== id;

            }
        );


    saveCreatorNotes();


    renderCreatorNotes();

}


/* ============================================================
   RENDER CREATOR NOTES
============================================================ */

function renderCreatorNotes() {

    var areas = [
        'North',
        'NCR',
        'South'
    ];


    areas.forEach(
        function(area) {

            var list =
                document.getElementById(
                    'creatorList' + area
                );


            if (!list) {
                return;
            }


            var notes =
                creatorNotes[area] || [];


            if (!notes.length) {

                list.innerHTML =

                    '<div class="creator-notes-empty">' +

                        'No notes yet for this area.' +

                    '</div>';


                return;

            }


            list.innerHTML =
                notes.map(
                    function(item) {

                        var safeName =
                            escapeCreatorNoteText(
                                item.name
                            );


                        var safeNote =
                            escapeCreatorNoteText(
                                item.note
                            );


                        return (

                            '<div class="creator-note-card">' +

                                '<button ' +
                                    'class="edit-creator-note" ' +
                                    'title="Edit note" ' +
                                    'onclick="editCreatorNote(\'' +
                                        area +
                                    '\',' +
                                        item.id +
                                    ')">' +

                                    '✏️' +

                                '</button>' +


                                '<button ' +
                                    'class="delete-creator-note" ' +
                                    'title="Delete note" ' +
                                    'onclick="deleteCreatorNote(\'' +
                                        area +
                                    '\',' +
                                        item.id +
                                    ')">' +

                                    '×' +

                                '</button>' +


                                '<div class="creator-note-name">' +

                                    safeName +

                                '</div>' +


                                (
                                    safeNote

                                    ?

                                    '<div class="creator-note-text">' +

                                        safeNote +

                                    '</div>'

                                    :

                                    ''

                                ) +

                            '</div>'

                        );

                    }
                )
                .join('');

        }
    );

}


/* ============================================================
   TOGGLE CREATOR AREA
============================================================ */

function toggleCreatorArea(area) {

    var section =
        document.getElementById(
            'creatorArea' + area
        );


    if (!section) {
        return;
    }


    section.classList.toggle(
        'collapsed'
    );

}


/* ============================================================
   TOGGLE CREATOR PANEL
============================================================ */

function toggleCreatorNotes() {

    var panel =
        document.getElementById(
            'creatorNotesPanel'
        );


    var tab =
        document.getElementById(
            'creatorNotesTab'
        );


    if (!panel) {
        return;
    }


    panel.classList.toggle(
        'collapsed'
    );


    if (
        panel.classList.contains(
            'collapsed'
        )
    ) {

        tab.textContent =
            '🎥 Notes';


        tab.title =
            'Open creator notes';

    }

    else {

        tab.textContent =
            '🎥 Creator Notes';


        tab.title =
            'Collapse creator notes';

    }


    setTimeout(
        function() {

            if (
                typeof map !==
                'undefined'
            ) {

                map.invalidateSize();

            }

        },

        280
    );

}


/* ============================================================
   ENTER KEY FOR CREATOR NOTES
============================================================ */

[
    'North',
    'NCR',
    'South'
].forEach(
    function(area) {

        var input =
            document.getElementById(
                'creatorName' + area
            );


        if (input) {

            input.addEventListener(
                'keydown',
                function(event) {

                    if (
                        event.key ===
                        'Enter'
                    ) {

                        event.preventDefault();

                        addCreatorNote(
                            area
                        );

                    }

                }
            );

        }

    }
);


/* ============================================================
   LOAD CREATOR NOTES
============================================================ */

loadCreatorNotes();


/* ============================================================
   FINAL MAP REFRESH
============================================================ */

setTimeout(
    function() {

        map.invalidateSize();

    },
    500
);

</script>
